<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="description"
        content="KAISOUL AI - AI chuyên lập trình"
    >

    <title>KAISOUL AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- SIDEBAR OVERLAY -->
    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
    ></div>

    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <div class="logo">
                KAISOUL <span>AI</span>
            </div>

            <button
                id="closeSidebar"
                class="icon-button"
                aria-label="Đóng menu"
            >
                ×
            </button>

        </div>

        <button
            id="newChatBtn"
            class="new-chat"
        >
            <span>＋</span>
            <span>New Chat</span>
        </button>

        <div class="sidebar-content">

            <section class="sidebar-section">

                <div class="sidebar-title">
                    Gần đây
                </div>

                <div id="recentList"></div>

            </section>

            <section class="sidebar-section">

                <div class="sidebar-title">
                    Lịch sử
                </div>

                <div id="historyList"></div>

            </section>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <div class="header-left">

                <button
                    id="openSidebar"
                    class="icon-button"
                    aria-label="Mở menu"
                >
                    ☰
                </button>

                <div
                    id="chatTitle"
                    class="header-title"
                >
                    KAISOUL AI
                </div>

            </div>

            <div class="header-right">

                <button
                    id="themeBtn"
                    class="icon-button"
                    aria-label="Đổi giao diện"
                >
                    ◐
                </button>

                <button
                    id="newChatHeader"
                    class="icon-button"
                    aria-label="Chat mới"
                >
                    ＋
                </button>

            </div>

        </header>


        <!-- CHAT -->
        <section
            id="chatContainer"
            class="chat-container"
        >

            <div
                id="chatContent"
                class="chat-content"
            >

                <!-- Welcome -->
                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-inner">

                        <div class="welcome-mark">
                            K
                        </div>

                        <h1 class="welcome-title">
                            KAISOUL AI
                        </h1>

                        <p class="welcome-description">
                            AI chuyên lập trình
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->
        <div class="composer-wrapper">

            <form
                id="chatForm"
                class="composer"
            >

                <textarea
                    id="messageInput"
                    rows="1"
                    autocomplete="off"
                    placeholder="Nhập yêu cầu..."
                ></textarea>

                <button
                    id="sendBtn"
                    type="submit"
                    class="send-button"
                    aria-label="Gửi"
                >
                    ↑
                </button>

            </form>

            <div class="composer-note">
                KAISOUL AI có thể mắc lỗi. Hãy kiểm tra code trước khi sử dụng.
            </div>

        </div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
